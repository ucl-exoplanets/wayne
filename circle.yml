machine:
  environment:
    PATH: /home/ubuntu/miniconda2/bin:$PATH
    CONDA_ENV_NAME: testenv

dependencies:
  override:
    - source activate $CONDA_ENV_NAME
    - conda install numpy=1.10.4 scipy=0.18.1 astropy=1.1.2
    - pip install -Ur requirements.txt

test:
  override:
      python setup.py test